<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 220" preserveAspectRatio="xMidYMax slice"><style>
@keyframes pulse{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.78)}}

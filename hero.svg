<mask id="mk"><rect width="1600" height="640" fill="url(#m)"/></mask>
<pattern id="d" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.5" fill="#0E6F72" fill-opacity=".35"/></pattern>
